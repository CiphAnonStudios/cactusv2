<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cactus Farmer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fullscreen Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Retro Scanline Overlay -->
  <div id="crt-overlay"></div>

  <!-- Studio Logo (Bottom Corner) -->
  <div id="studio-badge" title="Developer Studio">
    <img id="studio-logo" src="logo.png" alt="Studio Logo" onerror="this.style.display='none'; document.getElementById('studio-fallback').style.display='flex';">
    <div id="studio-fallback" class="pixel-studio-badge">
      <div class="studio-icon-pixel"></div>
      <span class="studio-text">CIPHANON STUDIOS</span>
    </div>
  </div>

  <!-- In-Game Stand Modals -->
  <div id="modal-container" class="hidden">
    <!-- Sell Stand Modal -->
    <div id="sell-modal" class="pixel-modal hidden">
      <div class="modal-header">CACTUS TRADING POST</div>
      <div class="modal-body">
        <p id="sell-parts-count">Parts In Bag: 0</p>
        <p id="sell-rate-text">Market Rate: $10 Gold / Part</p>
        <div class="modal-actions">
          <button id="btn-sell-one" class="pixel-btn">SELL 1</button>
          <button id="btn-sell-all" class="pixel-btn btn-gold">SELL ALL</button>
        </div>
      </div>
      <button id="btn-close-sell" class="pixel-btn btn-close">CLOSE [ESC]</button>
    </div>

    <!-- Upgrade Stand Modal -->
    <div id="shop-modal" class="pixel-modal hidden">
      <div class="modal-header">HAMMER & ABILITY WORKSHOP</div>
      <div class="modal-gold-display" id="shop-gold-display">GOLD: $0</div>
      <div class="modal-body upgrades-grid" id="upgrades-list"></div>
      <button id="btn-close-shop" class="pixel-btn btn-close">CLOSE [ESC]</button>
    </div>
  </div>

  <!-- Mobile Touch Controls -->
  <div id="mobile-controls">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
    <div id="action-buttons">
      <button id="btn-dash" class="touch-btn">DASH [I]</button>
      <button id="btn-attack" class="touch-btn btn-smash">SMASH [SPACE]</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
